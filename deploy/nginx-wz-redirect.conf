# Phase-two redirect for the former acceptance domain.
# Replace the existing wz.tomatopia.top vhost with this file only after the
# formal domain has passed homepage, CMS, form, robots, sitemap and llms checks.

map $uri $xyy_legacy_path {
    /index.html /;
    /about.html /about;
    default $uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name wz.tomatopia.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://56xyy.com$xyy_legacy_path$is_args$args;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name wz.tomatopia.top;

    ssl_certificate /etc/letsencrypt/live/wz.tomatopia.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wz.tomatopia.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://56xyy.com$xyy_legacy_path$is_args$args;
}
