# LOCAL CANDIDATE ONLY: native 8.138.148.179 main nginx.conf. Not deployed.
# Derived from the read-only production snapshot on 2026-10-23.
# Keep shared 443 listener options consistent; validate the installed HTTP/2 module before use.
# This is a complete main config, not an http/server include. See HSTS-ROLLOUT.md.

user nginx;
worker_processes auto;

error_log /data/xyy/logs/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /data/xyy/logs/nginx/access.log main;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # WebSocket支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 后端服务
    upstream backend {
        server 127.0.0.1:50031;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name 56xyy.com www.56xyy.com 8.138.148.179 _;

        location ^~ /.well-known/acme-challenge/ {
            root /data/xyy/acme/webroot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 308 https://56xyy.com$request_uri;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name 8.138.148.179 _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        return 308 https://56xyy.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.56xyy.com;

        # Initial HSTS: 7 days. After production observation: 2592000 (30 days), then 31536000 (1 year).
        add_header Strict-Transport-Security "max-age=604800" always;

        ssl_certificate     /data/xyy/acme/config/live/56xyy.com/fullchain.pem;
        ssl_certificate_key /data/xyy/acme/config/live/56xyy.com/privkey.pem;

        return 308 https://56xyy.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name 56xyy.com;

        # Initial HSTS: 7 days. After production observation: 2592000 (30 days), then 31536000 (1 year).
        add_header Strict-Transport-Security "max-age=604800" always;

        ssl_certificate     /data/xyy/acme/config/live/56xyy.com/fullchain.pem;
        ssl_certificate_key /data/xyy/acme/config/live/56xyy.com/privkey.pem;

        # 请求限制
        client_max_body_size 2m;
        client_body_timeout 30s;
        client_header_timeout 15s;

        # 隐藏敏感目录
        location = /cms {
            return 404;
        }

        location ^~ /cms/ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }

        location ~ ^/(admin|auth|graphql|activity|access|assets|collections|comments|dashboards|deployments|extensions|fields|files|flows|folders|items|license|notifications|operations|panels|permissions|policies|presets|translations|relations|revisions|roles|schema|server|settings|shares|users|utils|versions|mcp|ai)(/|$) {
            proxy_pass http://127.0.0.1:8055;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /.well-known/acme-challenge/ {
            root /data/xyy/acme/webroot;
            default_type text/plain;
            try_files $uri =404;
        }

        # 反向代理
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 请求头
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # 连接复用/WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }
    }
}
