# Production vhost for 56xyy.com on 47.82.105.103.
#
# This host keeps public :443 on Xray and forwards ordinary TLS traffic to
# Nginx on 127.0.0.1:8443. Do not change the HTTPS listeners below to :443.
# Install only after /etc/letsencrypt/live/56xyy.com contains a certificate
# covering both 56xyy.com and www.56xyy.com.

map $uri $seo_canonical_path {
    /index.html /;
    /about.html /about;
    default $uri;
}

upstream xyy_web {
    server 127.0.0.1:4321;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 56xyy.com www.56xyy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://56xyy.com$seo_canonical_path$is_args$args;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name www.56xyy.com;

    ssl_certificate /etc/letsencrypt/live/56xyy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/56xyy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://56xyy.com$seo_canonical_path$is_args$args;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name 56xyy.com;

    ssl_certificate /etc/letsencrypt/live/56xyy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/56xyy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20M;

    # Start without includeSubDomains until every 56xyy.com subdomain is audited.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /index.html {
        return 301 https://56xyy.com/$is_args$args;
    }

    location = /about.html {
        return 301 https://56xyy.com/about$is_args$args;
    }

    # Compatibility endpoints for browsers and the Directus login shell.
    # The canonical site icon remains the SVG asset declared in DocumentHead.
    location = /favicon.ico {
        return 302 https://56xyy.com/favicon.svg;
    }

    location = /cms/favicon.ico {
        return 302 https://56xyy.com/favicon.svg;
    }

    location = /cms {
        return 301 /cms/;
    }

    location ^~ /cms/ {
        proxy_pass http://127.0.0.1:8055/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /cms;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location ^~ /_astro/ {
        root /var/www/xyy-web/current/dist/client;
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /senlinqikan/pdf/ {
        root /var/www/xyy-web/current/dist/client;
        try_files $uri =404;
    }

    location = /llms.txt {
        root /var/www/xyy-web/current/dist/client;
        default_type text/plain;
        expires 1h;
        try_files /llms.txt =404;
    }

    location = /api/contact {
        client_max_body_size 8k;
        proxy_pass http://xyy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location / {
        root /var/www/xyy-web/current/dist/client;
        try_files $uri @xyy_node;
    }

    location @xyy_node {
        proxy_pass http://xyy_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
