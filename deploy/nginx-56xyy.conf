# Production nginx configuration for the 56xyy.com migration.
# Certificate issuance and DNS cutover must be completed before enabling it.

map $uri $seo_canonical_path {
    /index.html /;
    /about.html /about;
    default $uri;
}

upstream xyy_web {
    server 127.0.0.1:4321;
    keepalive 32;
}

# HTTP, www and the former test domain all collapse to the formal HTTPS URL.
server {
    listen 80;
    listen [::]:80;
    server_name 56xyy.com www.56xyy.com wz.tomatopia.top;
    return 301 https://56xyy.com$seo_canonical_path$is_args$args;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.56xyy.com;

    ssl_certificate /etc/letsencrypt/live/56xyy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/56xyy.com/privkey.pem;

    return 301 https://56xyy.com$seo_canonical_path$is_args$args;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wz.tomatopia.top;

    ssl_certificate /etc/letsencrypt/live/wz.tomatopia.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wz.tomatopia.top/privkey.pem;

    return 301 https://56xyy.com$seo_canonical_path$is_args$args;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 56xyy.com;

    ssl_certificate /etc/letsencrypt/live/56xyy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/56xyy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /index.html {
        return 301 https://56xyy.com/$is_args$args;
    }

    location = /about.html {
        return 301 https://56xyy.com/about$is_args$args;
    }

    location = /cms {
        return 301 /cms/;
    }

    location /cms/ {
        proxy_pass http://127.0.0.1:8055/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /cms;
        proxy_read_timeout 120s;
    }

    location ~* ^/(?:_astro/|fonts/|logos/|about/|introduce-720p\.mp4|introduce-poster\.jpg|logo\.png|favicon\.svg|china-map.*\.svg) {
        proxy_pass http://xyy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /robots.txt {
        proxy_pass http://xyy_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /sitemap.xml {
        proxy_pass http://xyy_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location / {
        proxy_pass http://xyy_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
