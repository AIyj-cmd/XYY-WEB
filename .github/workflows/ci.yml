name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      DEPLOY_ENVIRONMENT: ci
      DIRECTUS_URL: http://127.0.0.1:1
      DIRECTUS_CONTENT_TOKEN: ci-content-check-only
      DIRECTUS_CONTACT_TOKEN: ci-contact-check-only
      PUBLIC_DIRECTUS_URL: http://127.0.0.1:1
      PUBLIC_SITE_URL: http://127.0.0.1:4399
      ENABLE_DOMAIN_REDIRECTS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Validate candidate release identity
        run: |
          node scripts/create-release-manifest.mjs \
            --output /tmp/xyy-release-manifest.json \
            --git-sha "$RELEASE_GIT_SHA" \
            --build-time "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --environment "$DEPLOY_ENVIRONMENT"

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run release verification
        run: npm run verify:release
