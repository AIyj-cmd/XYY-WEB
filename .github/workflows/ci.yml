name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_GIT_SHA: ${{ github.sha }}
      DEPLOY_ENVIRONMENT: ci
      DIRECTUS_URL: http://127.0.0.1:1
      DIRECTUS_CONTENT_TOKEN: ci-content-check-only
      XIANSUO_API_URL: https://xiansuo-integration.test
      XIANSUO_INGEST_TOKEN: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      PUBLIC_DIRECTUS_URL: http://127.0.0.1:1
      PUBLIC_SITE_URL: http://127.0.0.1:4399
      ENABLE_DOMAIN_REDIRECTS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare cn-font-split Linux x64 native runtime
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          readonly asset='libffi-x86_64-unknown-linux-gnu.so'
          readonly expected_sha256='db4690e3b9c4b04f6dfa5965792585c389914038f6a4c90fbe73baaf16bbf19c'
          readonly expected_size='6145760'
          readonly asset_url="https://github.com/KonghaYao/cn-font-split/releases/download/7.6.8/${asset}"
          readonly native_dir='node_modules/cn-font-split/dist'
          readonly target="${native_dir}/${asset}"
          test -d "$native_dir"

          download="$(mktemp "${RUNNER_TEMP:-/tmp}/cn-font-split.XXXXXX")"
          staged="$(mktemp "${native_dir}/.${asset}.ci.XXXXXX")"
          trap 'rm -f -- "$download" "$staged"' EXIT
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 90 --output "$download" "$asset_url"
          actual_size="$(stat --format='%s' "$download")"
          if [[ "$actual_size" != "$expected_size" ]]; then
            printf 'cn-font-split native asset size mismatch: expected=%s actual=%s path=%s\n' \
              "$expected_size" "$actual_size" "$download" >&2
            exit 1
          fi
          if ! printf '%s  %s\n' "$expected_sha256" "$download" | sha256sum --check; then
            printf 'cn-font-split native asset SHA-256 mismatch: expected=%s path=%s\n' \
              "$expected_sha256" "$download" >&2
            exit 1
          fi

          install --mode=0644 "$download" "$staged"
          mv -f "$staged" "$target"
          stat --format='native path=%n size=%s mode=%a' "$target"
          if ! ldd_output="$(ldd "$target")"; then
            echo 'ldd failed for cn-font-split native runtime' >&2
            exit 1
          fi
          printf '%s\n' "$ldd_output"
          if grep -Fq 'not found' <<<"$ldd_output"; then
            echo 'cn-font-split native runtime has missing dynamic dependencies' >&2
            exit 1
          fi
          node -e "require('cn-font-split/dist/node/index.js')"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Validate candidate release identity
        run: |
          node scripts/create-release-manifest.mjs \
            --output /tmp/xyy-release-manifest.json \
            --git-sha "$RELEASE_GIT_SHA" \
            --build-time "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --environment "$DEPLOY_ENVIRONMENT"

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run release verification
        run: npm run verify:release
